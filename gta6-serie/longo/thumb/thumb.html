<!doctype html><html><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:720px;overflow:hidden;font-family:"Archivo Black",sans-serif;background:#1a0b3d}
.bg{position:absolute;inset:-20px;background:url(bg.png) center/cover;filter:blur(7px) saturate(1.3)}
.sh{position:absolute;inset:0;background:linear-gradient(90deg,rgba(18,0,43,.25),rgba(18,0,43,.55))}
.vs{position:absolute;top:70px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:30px}
.c{font-size:120px;padding:10px 34px;border-radius:26px;border:10px solid #3DF5FF;background:#fff;color:#12002b;transform:rotate(-3deg)}
.c.b{background:#12002b;color:#fff;border-color:#ff2e88;box-shadow:0 0 60px #ff2e88;transform:rotate(3deg)}
.x{font-size:120px;color:#ffd84d;-webkit-text-stroke:14px #12002b;paint-order:stroke fill}
.t{position:absolute;top:330px;left:0;right:0;text-align:center;font-size:120px;line-height:1;color:#fff;-webkit-text-stroke:18px #12002b;paint-order:stroke fill;text-shadow:0 0 50px #ff2e88}
.t em{font-style:normal;color:#3DF5FF}
.tag{position:absolute;bottom:50px;left:0;right:0;display:flex;justify-content:center}
.tag span{font-size:54px;color:#12002b;background:#ffd84d;padding:8px 30px;border-radius:16px;border:6px solid #12002b}
</style></head><body><div class="bg"></div><div class="sh"></div>
<div class="vs"><div class="c">GTA 5</div><div class="x">VS</div><div class="c b">GTA 6</div></div>
<div class="t">TUDO QUE <em>MUDOU!</em></div>
<div class="tag"><span>TODAS AS DIFERENÇAS</span></div>
</body></html>
